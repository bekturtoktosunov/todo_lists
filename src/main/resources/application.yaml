spring:
  application:
    name: todo-list

  datasource:
    url: jdbc:h2:mem:todo-db
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: true

todo:
  expiration:
    delay-ms: 10000